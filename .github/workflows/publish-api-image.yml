name: Publish API image

# Builds the API Docker image and pushes it to GitHub Container Registry (used by Railway).
on:
  push:
    branches: [main]
    paths: ["src/**", "Dockerfile", "Directory.Build.props", ".github/workflows/publish-api-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hr-vinex-api:latest
            ghcr.io/${{ github.repository_owner }}/hr-vinex-api:${{ github.sha }}
